<style>
:root{--bg0:#060b14;--bg2:#0f1d2e;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.03);
  --brd:rgba(255,255,255,.10);--teal:#2ee6c5;--teal2:#12a78c;--txt:#eef4f5;--dim:#8ba0ad;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Prompt',system-ui,sans-serif;color:var(--txt);min-height:100vh;
  padding:calc(22px + env(safe-area-inset-top,0)) 18px 48px;
  background:radial-gradient(900px 500px at 85% -10%,rgba(56,189,248,.13),transparent 55%),
             radial-gradient(1000px 560px at 78% 8%,rgba(46,230,197,.14),transparent 58%),
             radial-gradient(820px 520px at -10% 110%,rgba(18,167,140,.12),transparent 55%),
             linear-gradient(160deg,var(--bg2),var(--bg0));background-attachment:fixed}
.wrap{max-width:1120px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}
.logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;overflow:hidden;background:#c6ec1b;box-shadow:0 8px 26px rgba(46,230,197,.35);flex:0 0 auto}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:19px;font-weight:700}
.sub{font-size:12.5px;color:var(--dim);margin-top:2px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--brd);padding:6px 8px 6px 6px;border-radius:999px;font-size:13px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(145deg,var(--teal),var(--teal2));color:#04130f;font-weight:700;font-size:15px}
.av img{width:100%;height:100%;object-fit:cover}
.who .nm{font-weight:600;line-height:1.2}
.who .rl{font-size:10.5px;color:var(--dim)}
.menu{position:relative}
.mbtn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;padding:4px 8px}
.mbtn:hover{color:var(--teal)}
.mlist{position:absolute;right:0;top:calc(100% + 8px);background:#0f2031;border:1px solid var(--brd);
  border-radius:14px;padding:6px;min-width:180px;box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;z-index:20}
.mlist.show{display:block}
.mlist button{width:100%;background:none;border:none;color:var(--txt);text-align:left;font-family:inherit;
  font-size:13.5px;padding:10px 12px;border-radius:9px;cursor:pointer}
.mlist button:hover{background:rgba(255,255,255,.06)}
/* แถบเตือนเรื่องสิทธิ์ — ต้องอ่านออกทันทีว่าทำไมการ์ดถึงหาย และไปบอกใคร */
.permwarn{background:rgba(251,191,36,.13);border:1px solid rgba(251,191,36,.35);
  color:#fde68a;border-radius:13px;padding:11px 14px;font-size:13px;line-height:1.6;
  margin-bottom:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1 1 240px;position:relative;min-width:0}
.search input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--brd);color:var(--txt);
  border-radius:12px;padding:12px 14px 12px 40px;font-size:14px;outline:none;font-family:inherit}
.search input:focus{border-color:var(--teal)}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim)}
.stat{font-size:12px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--brd);border-radius:18px;padding:20px 18px;
  cursor:pointer;transition:.18s;position:relative;overflow:hidden;text-align:left;
  font-family:inherit;color:inherit;display:flex;flex-direction:column;gap:2px}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,var(--teal))}
.card:hover{transform:translateY(-3px);border-color:var(--c,var(--teal));
  box-shadow:0 16px 34px rgba(0,0,0,.35)}
.card:disabled{opacity:.45;cursor:not-allowed;transform:none}
.ico{font-size:30px;margin-bottom:10px;line-height:1}
.ttl{font-size:15px;font-weight:600}
.desc{font-size:12px;color:var(--dim);line-height:1.55;margin-top:3px}
.tag{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.tag.wip{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
.tag.planned{background:rgba(255,255,255,.06);color:var(--dim);border:1px solid var(--brd)}
/* ป้ายเวอร์ชันบนการ์ด — พี่เอสั่ง 9 ก.ย. 69
   "มันไป update version อะไร ระบุไว้ที่หน้า app หลักด้วยนะ"
   ‼ ค่ามาจากเซิร์ฟเวอร์ที่รันอยู่จริง (modules/<แอป>/version.js)
     ไม่ใช่เลขที่พิมพ์ฝังไว้ในหน้าเว็บ — จึงใช้เช็คได้ว่าดีพลอยขึ้นแล้วหรือยัง */
.ver{position:absolute;bottom:12px;right:14px;font-size:10.5px;font-weight:700;
  padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.07);
  color:var(--dim);border:1px solid var(--brd);
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;cursor:help}
.card:hover .ver{color:var(--c,var(--teal));border-color:var(--c,var(--teal))}
/* ═══════════════════════════════════════════════════════════════════
 *  🔴 ป้ายมุมขวาล่างของ "แอปนอกระบบ" — พี่เอสั่ง 13 ก.ย. 69
 *
 *  ‼ แอปนอกระบบไม่มี modules/<แอป>/version.js ⇒ ไม่มีเลขเวอร์ชันให้อ่าน
 *    ห้ามพิมพ์ v1.0.0 ฝังไว้เอง — เลขปลอมอ่านเหมือนเลขจริงทุกประการ
 *    วันหนึ่งจะมีคนเอาไปเช็คว่าดีพลอยขึ้นแล้วหรือยัง แล้วได้คำตอบผิด
 *    ⇒ ใส่คำที่ตรงความจริงแทน ("ภายนอก") และกดดูประวัติไม่ได้ (ไม่มีให้ดู)
 *  ‼ ไม่ใช้ฟอนต์ monospace เพราะไม่ใช่ตัวเลขเวอร์ชัน
 *  ‼ ชื่อคลาสต้องไม่ชนกับ .ext (บรรทัดใต้ชื่อแอป) — คลาสเดียวกันจะทับค่ากันเงียบ ๆ */
.ver.nover{font-family:inherit;font-weight:600;cursor:default}
.card:hover .ver.nover{color:var(--dim);border-color:var(--brd)}
/* บรรทัดบอกว่า "คนละที่" — ‼ ห้ามซ่อนบนมือถือเหมือน .desc
   เพราะนี่คือสิ่งที่ต้องเห็นก่อนกด ว่ากำลังจะออกไปนอกระบบ */
.ext{font-size:11px;color:var(--c,var(--teal));opacity:.9;margin-top:7px;font-weight:500}
/* กล่องเล่าว่าเวอร์ชันไหนแก้อะไร */
.vwrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:60;
  align-items:center;justify-content:center;padding:20px}
.vwrap.on{display:flex}
.vbox{background:var(--panel);border:1px solid var(--brd);border-radius:16px;
  max-width:640px;width:100%;max-height:80vh;overflow:auto;padding:20px 22px}
.vbox h3{margin:0 0 4px;font-size:16px}
.vbox .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.vrow{border-top:1px solid var(--brd);padding:11px 0}
.vrow b{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.vrow .when{color:var(--dim);font-size:11px;margin-left:6px}
.vrow .what{font-size:12.5px;line-height:1.65;margin-top:4px}
.vclose{margin-top:14px;background:transparent;border:1px solid var(--brd);color:var(--dim);
  border-radius:9px;padding:7px 15px;cursor:pointer;font-size:12.5px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--dim);font-size:14px}
/* 🔴 ลิงก์เล็ก ๆ ท้ายหน้า — ที่อยู่ใหม่ของ "บันทึกการใช้งาน" (พี่เอสั่ง 11 ก.ย. 69) */
.footlinks{margin:26px 2px 8px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.footlinks a{color:var(--dim);font-size:12px;text-decoration:none;opacity:.75;
  border-bottom:1px dotted transparent;padding-bottom:1px}
.footlinks a:hover{opacity:1;border-bottom-color:var(--dim)}
.skel{background:var(--panel2);border:1px solid var(--brd);border-radius:18px;height:142px;
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.7}}
/* ═══════════════════════════════════════════════════════════════════
 *  🔀 หน้ารวมแอปแบบ "ขั้นตอนการทำงาน" — พี่เอสั่ง 26 ก.ย. 69
 *    "ทำให้หน้านี้ เป็นเหมือน process flow ของการทำงาน … ทำสัญลักษณ์ ไหลเป็นขั้นตอน"
 *    "ใส่หมายเลขลำดับ app ไว้ด้วยนะ มองให้เห็นชัด"
 *  โครง: แถบภาพรวม 7 ขั้น (กดแล้วเลื่อนไปขั้นนั้น) → เส้นเวลาแนวตั้ง
 *        แต่ละขั้น = วงเลขขั้น + ชื่อขั้น + การ์ดแอปที่มีเลข 1.1 · 1.2 …
 *        ระหว่างขั้น = ลูกศรลง + "ส่งต่อเมื่อ…" (เงื่อนไขที่งานไหลไปขั้นถัดไป)
 * ═══════════════════════════════════════════════════════════════════ */
.flow{display:block}
.ovw{display:flex;align-items:stretch;gap:0;overflow-x:auto;scrollbar-width:none;margin:0 0 22px;
  padding:4px 2px 6px}
.ovw::-webkit-scrollbar{display:none}
.ovw a{flex:1 1 0;min-width:112px;display:flex;flex-direction:column;align-items:center;gap:6px;
  text-decoration:none;color:var(--txt);padding:12px 6px 10px;border-radius:14px;position:relative;
  background:var(--panel2);border:1px solid var(--brd);transition:.15s}
.ovw a:hover{border-color:var(--sc);background:rgba(255,255,255,.06)}
.ovw a .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;
  font-size:15px;color:#051018;background:var(--sc);box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 22%,transparent)}
.ovw a .t{font-size:12px;font-weight:600;text-align:center;line-height:1.3;text-wrap:balance}
.ovw a .c{font-size:10.5px;color:var(--dim)}
.ovw .ar{flex:0 0 22px;display:grid;place-items:center;color:var(--dim);font-size:16px}
.stage{display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:14px;scroll-margin-top:16px}
.spine{position:relative;display:flex;flex-direction:column;align-items:center}
.spine .n{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;
  font-size:22px;font-weight:800;color:#051018;background:var(--sc);position:relative;z-index:1;
  box-shadow:0 0 0 5px color-mix(in srgb,var(--sc) 20%,transparent),0 10px 26px -8px var(--sc)}
.spine .ln{flex:1;width:3px;margin-top:8px;border-radius:3px;min-height:20px;
  background:linear-gradient(var(--sc),var(--sn,var(--sc)))}
.sbody{padding-bottom:10px;min-width:0}
.shead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:52px;padding-top:4px}
.shead .k{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--sc)}
.shead h2{font-size:18px;font-weight:700;margin:0}
.shead p{flex-basis:100%;font-size:12.5px;color:var(--dim);margin-top:-2px}
.lane{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;margin-top:10px}
.lane .card{padding-top:18px;padding-bottom:36px}
.num i{font-style:normal;margin:0 2px;opacity:.75}
.num{position:absolute;top:12px;right:12px;min-width:48px;height:30px;padding:0 10px;border-radius:9px;
  display:grid;grid-auto-flow:column;place-items:center;font-size:16px;font-weight:800;letter-spacing:.02em;
  color:#051018;background:var(--sc,var(--teal));font-variant-numeric:tabular-nums}
.card:disabled .num{background:rgba(255,255,255,.18);color:var(--dim)}
.card .tag{top:46px}
.hand{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
.hand .pill{font-size:12px;color:var(--txt);background:rgba(255,255,255,.05);border:1px dashed var(--brd);
  border-radius:999px;padding:5px 12px}
.hand .pill b{color:var(--sn);font-weight:600}
.hand .dn{color:var(--sn);font-size:16px;line-height:1}
.stage.sup{margin-top:18px;padding-top:22px;border-top:1px solid var(--brd)}
.stage.sup .spine .n{font-size:20px;background:rgba(255,255,255,.08);color:var(--txt);box-shadow:none;
  border:1px solid var(--brd)}
.stage.sup .num{background:rgba(255,255,255,.12);color:var(--txt)}
.stage.mtop{margin-bottom:20px;padding-bottom:6px;border-bottom:1px solid var(--brd)}   /* 📊 รอบ 221 — แถบ Management Report บนสุด */
@media(max-width:600px){
  .stage{grid-template-columns:44px minmax(0,1fr);column-gap:10px}
  .spine .n{width:40px;height:40px;border-radius:12px;font-size:18px}
  .shead{min-height:40px}
  .shead h2{font-size:16px}
  .lane{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
  .num{min-width:38px;height:24px;font-size:12.5px;top:10px;right:10px}
  .card .tag{top:40px}
  .ovw a{min-width:92px}
}
@media(max-width:600px){
  header .who{margin-left:0;order:3;width:100%}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  .card{padding:16px 14px;border-radius:15px}.ico{font-size:25px}.ttl{font-size:13.5px}
  .desc{display:none}
  .ext{font-size:10px;margin-top:5px}   /* ‼ ย่อได้ แต่ห้ามซ่อน */
}

</head>

       "ตัดเอาบันทึกการใช้งานออกไป แต่ช่วยทำเป็น link text เล็กๆ ไว้ข้างล่างสุดแทน"

<script>
const $ = id => document.getElementById(id);
let MODS = [];
let HUBV = '';   /* เวอร์ชันของทั้งระบบ — เอาไว้เทียบตอนไล่ปัญหาดีพลอย */
let MIN_PW = 4;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── โหลดผู้ใช้ + รายการแอป ── */
(async function init(){
  try {
    const [me, mods] = await Promise.all([
      fetch('/api/me').then(r => r.json()),
      fetch('/api/modules').then(r => r.json())
    ]);
    if (!me.ok) { location.href = '/login'; return; }

    const u = me.user;
    $('nm').textContent = u.nickname || u.name || u.username;
    $('rl').textContent = u.permission || u.role;
    $('av').textContent = (u.nickname || u.name || u.username || '?').trim().charAt(0).toUpperCase();

    /* เมนูซิงค์ — เซิร์ฟเวอร์เป็นคนตัดสิน (me.canSync จาก /api/me)
     *  🔴 พี่เอสั่ง 14 ก.ย. 69: เปิดได้เฉพาะ user admin กับ namna เท่านั้น
     *    ⇒ ใช้ role === 'ADMIN' ตัดสินเองที่หน้าเว็บไม่ได้แล้ว (ADMIN คนอื่นก็ห้าม)
     *    ‼ ตัวจริงที่กันยังเป็นฝั่งเซิร์ฟเวอร์ที่ /sync + /api/admin/sync|drive|booking-time */
    if (me.canSync) $('syncbtn').style.display = '';
    MIN_PW = me.minPassword || 4;

    MODS = mods.modules || [];
    HUBV = mods.hub || '';

    /* ═══════════════════════════════════════════════════════════════
     *  การ์ด "ซิงก์ข้อมูลกับ Google Sheets" — พี่เอสั่ง 6 ก.ย. 69
     *
     *  ‼ ไม่ใช่แอปย่อยในทะเบียนโมดูล แต่เป็นเครื่องมือของระบบ
     *    จึงต่อเข้าไปในรายการตอนวาด แทนที่จะไปใส่ในทะเบียน
     *    (ใส่ในทะเบียนแล้วมันจะไปโผล่ในที่อื่นที่อ่านทะเบียนด้วย)
     *
     *  🔒 เฉพาะ user admin · namna — ปุ่มเดิมด้านบนก็คุมด้วยเงื่อนไขเดียวกัน
     *    ตัวจริงที่กันคือฝั่งเซิร์ฟเวอร์ที่ /sync ไม่ใช่การซ่อนการ์ดนี้
     *    ‼ ค่านี้มาจาก core/app-access.js ที่เดียว ไม่ได้คิดเองที่หน้าจอ */
    if (me.canSync) {
      MODS = MODS.concat([{
        key: '__sync__', icon: '🔄', color: '#0ea5e9',

    apps: ['jobcard'], out: 'ผลิตเสร็จ ผ่าน QC' },
  { n: 6, c: '#fb923c', t: 'ติดตั้ง & จัดส่ง', d: 'เช็กความพร้อมหน้างาน · จองคิวช่าง · วางแผนรถส่ง',
    apps: ['checklist', 'booking', 'delivery'], out: 'ส่งมอบงานให้ลูกค้า' },
  { n: 7, c: '#facc15', t: 'หลังการขาย', d: 'รีวิวงานติดตั้ง · แจ้งซ่อม · ต่อประกัน',
    apps: ['reviews', 'aftersale'] },
];
const FLOW_SUP = { n: 'S', c: '#8ba0ad', t: 'ระบบสนับสนุน', d: 'ใช้ได้ทุกขั้น — ช่าง · เครื่องจักร · ข้อมูลกลาง · คุยงาน · ลางาน' };

function cardHtml(m, no, sc){
  const tag = m.status === 'wip' ? '<span class="tag wip">กำลังย้าย</span>'
            : m.status === 'planned' ? '<span class="tag planned">ยังไม่เปิด</span>' : '';
  return `<button class="card" style="--c:${esc(m.color)};--sc:${esc(sc)}"
      ${m.canUse ? '' : 'disabled'} data-k="${esc(m.key)}"
      title="${esc(m.canUse ? no + ' ' + m.title : 'ยังเปิดใช้งานไม่ได้')}">
      <span class="num">${esc(no).replace('.', '<i>.</i>')}</span>
      ${tag}
      <div class="ico">${esc(m.icon)}</div>
      <div class="ttl">${esc(m.title)}</div>
      <div class="desc">${esc(m.subtitle||'')}</div>
      ${m.external ? `<div class="ext">↗ ${esc(m.external)}</div>` : ''}
      ${m.version ? `<span class="ver" data-v="${esc(m.key)}"
         title="เวอร์ชันของแอปนี้บนเซิร์ฟเวอร์ที่รันอยู่จริง — กดเพื่อดูว่าแก้อะไรไป">v${esc(m.version)}</span>`
       : m.badge ? `<span class="ver nover" title="${esc(m.badgeTitle || 'แอปนอกระบบ — ไม่มีเลขเวอร์ชันจากเซิร์ฟเวอร์นี้')}">${esc(m.badge)}</span>`
       : ''}
    </button>`;
}

function render(){
  const q = $('q').value.trim().toLowerCase();
  const list = MODS.filter(m => !FOOT_ONLY.includes(m.key)).filter(m =>
    !q || (m.title + ' ' + (m.subtitle||'') + ' ' + m.key).toLowerCase().includes(q));
  renderFootLinks();

  if (!list.length) { $('grid').innerHTML = '<div class="empty">ไม่พบแอปที่ค้นหา</div>'; return; }

  /* เลขแอป = เลขขั้น.ลำดับในขั้น — นับจาก "แอปที่บัญชีนี้เห็นทั้งหมด" ไม่ใช่ผลค้นหา
   *   ⇒ ไม่มีเลขกระโดด (3.1 → 3.3) และค้นหาแล้วเลขไม่เลื่อน (1.2 ยังเป็น 1.2) */
  const seen = MODS.filter(m => !FOOT_ONLY.includes(m.key));
  const seenKeys = new Set(seen.map(m => m.key));
  const NO = new Map();
  const inFlow = new Set();
  FLOW.forEach(st => { let i = 0; st.apps.forEach(k => { if (seenKeys.has(k)) { NO.set(k, st.n + '.' + (++i)); inFlow.add(k); } }); });
  TOP_ONLY.forEach((k, i) => { if (seenKeys.has(k)) { NO.set(k, TOP_HEAD.n + (i + 1)); inFlow.add(k); } });   /* 📊 รอบ 221 — ไม่นับเป็นเลข S */
  seen.filter(m => !inFlow.has(m.key)).forEach((m, i) => NO.set(m.key, 'S' + (i + 1)));

  const byKey = new Map(list.map(m => [m.key, m]));
  const stages = FLOW.map(st => Object.assign({}, st, {
    items: st.apps.filter(k => byKey.has(k)).map(k => ({ m: byKey.get(k), no: NO.get(k) })),
  })).filter(st => st.items.length);
  const rest = list.filter(m => !inFlow.has(m.key));
  const sup = Object.assign({}, FLOW_SUP, { items: rest.map(m => ({ m, no: NO.get(m.key) })) });

  const all = sup.items.length ? stages.concat([sup]) : stages;
  /* 📊 รอบ 221 — แถบบนสุด (Management Report) */
  const tops = TOP_ONLY.filter(k => byKey.has(k)).map(k => ({ m: byKey.get(k), no: NO.get(k) }));
  const topHtml = tops.length ? `<section class="stage mtop" id="st-top" style="--sc:${TOP_HEAD.c}">
        <div class="spine"><span class="n">${esc(TOP_HEAD.n)}</span></div>
        <div class="sbody">
          <div class="shead"><span class="k">${esc(TOP_HEAD.k)}</span><h2>${esc(TOP_HEAD.t)}</h2><p>${esc(TOP_HEAD.d)}</p></div>
          <div class="lane">${tops.map(x => cardHtml(x.m, x.no, TOP_HEAD.c)).join('')}</div>
        </div>
      </section>` : '';
  const ovw = stages.map((st, i) =>
    `<a href="#st-${st.n}" style="--sc:${st.c}"><span class="n">${st.n}</span><span class="t">${esc(st.t)}</span>` +
    `<span class="c">${st.items.length} แอป</span></a>` + (i < stages.length - 1 ? '<span class="ar">➜</span>' : '')).join('');

  $('grid').innerHTML = topHtml + (stages.length > 1 ? `<nav class="ovw" aria-label="ขั้นตอนการทำงาน">${ovw}</nav>` : '') +
    all.map((st, i) => {
      const next = all[i + 1];
      const isSup = st === sup;
      const hand = !isSup && next && next !== sup
        ? `<div class="hand"><span class="dn">▼</span><span class="pill">ส่งต่อเมื่อ <b>${esc(st.out || '')}</b></span></div>` : '';
      return `<section class="stage${isSup ? ' sup' : ''}" id="st-${esc(st.n)}" style="--sc:${st.c};--sn:${(next && next !== sup) ? next.c : st.c}">
        <div class="spine"><span class="n">${esc(st.n)}</span>${hand ? '<span class="ln"></span>' : ''}</div>
        <div class="sbody">
          <div class="shead"><span class="k">${isSup ? 'ใช้ร่วมทุกขั้น' : 'ขั้นที่ ' + esc(st.n)}</span><h2>${esc(st.t)}</h2><p>${esc(st.d)}</p></div>
          <div class="lane">${st.items.map(x => cardHtml(x.m, x.no, isSup ? '' : st.c)).join('')}</div>
          ${hand}
        </div>
      </section>`;
    }).join('');

  /* กดที่ป้ายเวอร์ชัน = ดูว่าแก้อะไรไป ‼ ต้องไม่เผลอเปิดแอปตาม (stopPropagation) */
  document.querySelectorAll('.ver[data-v]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); e.preventDefault(); showVer(el.dataset.v); };
  });

  document.querySelectorAll('.card[data-k]').forEach(el => {
    /* การ์ดเครื่องมือระบบมี href ตรง ๆ ไม่ต้องขอตั๋ว SSO เหมือนแอปย่อย
       ‼ แต่ก็ต้องขึ้นแท็บใหม่เหมือนการ์ดอื่น — พี่เอสั่ง "กดเปิด app แต่ละแอป
         ให้ขึ้น new tab" ไม่ได้ยกเว้นการ์ดไหน */
    const m = MODS.find(x => x.key === el.dataset.k);
    el.onclick = m && m.href ? () => openUrl(m.href, tabName(el.dataset.k))
                             : () => openApp(el.dataset.k);
  });
}

/* ═══════════════════════════════════════════════════════════════════
 *  🏷️ รอบ 157 — เวอร์ชันจริงของ Graphic Design Solution บนการ์ด
 *  พี่เอสั่ง 27 ก.ย. 69: "ให้ app graphic design solution มี version update ด้วย"
 *  ‼ เลขมาจากเซิร์ฟเวอร์ของเรา (/api/graphic-version) · ไม่ได้พิมพ์ฝังไว้ในหน้านี้
 *  🏷️ รอบ 201 — เลขบนป้าย = เลข 3 ท่อนแบบแอปอื่น (core/gds-app-version.js)
 *    เวลา build ที่รันอยู่จริง (อ่านสดจาก /api/health ของแอปนั้น) ไปอยู่ในหัวกล่องประวัติ
 *  ‼ ไม่รอ — วาดการ์ดก่อน แล้วค่อยเติมป้าย (แอปต้องเร็ว)
 *  ‼ อ่านไม่ได้ = ป้ายคงเป็น "ภายนอก" เหมือนเดิม การ์ดยังกดเข้าแอปได้ */
function loadGraphicVer(){
  const fail = () => {
    const g = MODS.find(x => x.key === '__graphic__');
    if (!g || g.version) return;
    g.badge = 'ภายนอก'; render();
  };
  fetch('/api/graphic-version').then(r => r.json()).then(v => {
    const g = MODS.find(x => x.key === '__graphic__');
    if (!g) return;
    /* 🏷️ รอบ 201 — เลข 3 ท่อนแบบแอปอื่นเท่านั้น (ห้ามเอาเลขวันที่ v2026-… มาขึ้นป้ายอีก) */
    if (!v || v.ok !== true || !/^\d+\.\d+\.\d+$/.test(String(v.version || ''))) return fail();
    g.version = String(v.version);
    g.changelog = Array.isArray(v.changelog) ? v.changelog : [];
    const L = (v.live && v.live.ok === true) ? v.live : null;
    g.verSub = 'แอปนอกระบบ รันบน Railway' + (L
      ? ' · ที่รันอยู่จริง: build ' + (L.version || L.build || '-') + (L.deployed ? ' (อัปเดตขึ้นระบบ ' + L.deployed + ')' : '') + (L.engine ? ' · เอนจิน ' + L.engine : '')
      : ' · อ่านเวลา build จากแอปไม่ได้ตอนนี้');
    render();
  }).catch(fail);
}

/* ── ป้ายเวอร์ชัน: เล่าว่าเวอร์ชันไหนแก้อะไรไป ──
   ‼ ข้อมูลมาจาก CHANGELOG ใน modules/<แอป>/version.js ของเซิร์ฟเวอร์จริง
     ไม่ได้พิมพ์ไว้ในหน้านี้ — แก้ที่ไฟล์เดียว หน้านี้ตามเอง */
function showVer(key){
  const m = MODS.find(x => x.key === key);
  if (!m) return;
  const logs = m.changelog || [];
  document.getElementById('vbody').innerHTML =
    `<h3>${esc(m.icon)} ${esc(m.title)} — v${esc(m.version)}</h3>` +
    `<div class="sub">${esc(m.verSub || 'เวอร์ชันของแอปนี้บนเซิร์ฟเวอร์ที่รันอยู่จริง')}` +
    (HUBV && !m.verSub ? ` · ทั้งระบบ CRM Hub v${esc(HUBV)}` : '') + `</div>` +
    (logs.length
      ? logs.map(x => `<div class="vrow"><b>v${esc(x.v)}</b>` +
          `<span class="when">${esc(x.when||'')}</span>` +
          `<div class="what">${esc(x.what||'')}</div></div>`).join('')
      : '<div class="vrow"><div class="what">ยังไม่ได้จดประวัติของเวอร์ชันนี้ไว้</div></div>');
  document.getElementById('vwrap').classList.add('on');
}
function closeVer(){ document.getElementById('vwrap').classList.remove('on'); }

/* ═══════════════════════════════════════════════════════════════════
 *  🔴 เปิดแอปขึ้น "แท็บใหม่" — พี่เอสั่ง 13 ก.ย. 69
 *     "เวลากดเปิด app แต่ละแอป ให้ขึ้น new tab นะ
 *      ไม่ต้องกดย้อนไปย้อนมาเสียเวลา"
 *     ⇒ หน้ารวมแอปค้างอยู่ที่เดิม กดแอปถัดไปได้ทันทีไม่ต้องย้อนกลับ
 *
 *  ‼ ตัดสินใจ: "1 แอป 1 แท็บ" (ตั้งชื่อแท็บว่า app-<key>)
 *    ไม่ใช่แท็บใหม่ทุกครั้งที่กด — เพราะคนกดแอปเดิมซ้ำระหว่างวันบ่อยมาก
 *    ถ้าเปิดใหม่ทุกครั้ง กดสิบทีได้สิบแท็บ สุดท้ายก็เสียเวลาไล่ปิดอยู่ดี
 *    ซึ่งขัดกับที่สั่งมาว่า "ไม่ต้องเสียเวลา"
 *    กดซ้ำ = เบราว์เซอร์พาไปที่แท็บเดิมของแอปนั้นและโหลดตั๋วใบใหม่ให้
 *
 *  ‼ ทำไมต้องเปิดแท็บ "ก่อน" ขอตั๋ว ไม่ใช่รอตั๋วมาแล้วค่อยเปิด:
 *    window.open ที่เรียกหลัง await = หลุดจากจังหวะคลิกของคนไปแล้ว
 *    เบราว์เซอร์ถือเป็นป๊อปอัปแล้วบล็อกทิ้งเงียบ ๆ (Chrome/Safari)
 *    ⇒ เปิดแท็บเปล่าคาไว้ตอนคลิก แล้วค่อยพาไป URL จริงตอนตั๋วมาถึง
 *
 *  ‼ ตั๋ว SSO ต้องติดไปกับแท็บใหม่ด้วย (?t=…) ไม่งั้นแท็บใหม่เด้งหน้าล็อกอิน
 *
 *  ‼ ความปลอดภัย: ใช้ opener = null แทน rel/feature "noopener"
 *    เพราะ window.open(...,'noopener') คืนค่า null ทำให้ถือ reference
 *    ไว้พาแท็บไป URL จริงไม่ได้ — ผลลัพธ์เท่ากันคือแท็บใหม่แตะ
 *    window ของหน้ารวมแอปไม่ได้
 * ═══════════════════════════════════════════════════════════════════ */
const tabName = key => 'app-' + String(key).replace(/[^\w-]/g, '_');

/* เปิด URL ที่รู้ตัวอยู่แล้วขึ้นแท็บของแอปนั้น (การ์ดเครื่องมือระบบที่มี href)
   ‼ ถ้าโดนบล็อกป๊อปอัป (คืน null) ให้เปิดแท็บเดิมแทน — ดีกว่ากดแล้วไม่เกิดอะไร */
function openUrl(url, name){
  const tab = window.open(url, name);
  if (tab) { try { tab.opener = null; } catch (_) {} }
  else location.href = url;
}

/* ── เปิดแอป: ขอ SSO ticket ก่อนเสมอ ──
   ตั๋วอายุ 60 วินาที ผูกกับผู้ใช้+โมดูลนี้เท่านั้น
   (แทน ?u=<username> แบบเดิมที่ใครก็พิมพ์ชื่อคนอื่นได้)

   sameTab = true ⇒ เปิดในแท็บเดิมแบบเดิมเป๊ะ
   ‼ ใช้กับลิงก์ท้ายหน้า "บันทึกการใช้งาน" ที่พี่เอสั่งไว้ว่าห้ามเปลี่ยน

   🔴 ชื่อฟังก์ชันต้องไม่ใช่ open() — กับดักจริงของเบราว์เซอร์:
      function open(){} ที่ประกาศระดับบนสุดของสคริปต์ จะไปทับ window.open
      (ตัวแปรระดับบนสุด = property ของ window) แล้ว window.open ข้างล่าง
      จะกลายเป็นการเรียกตัวเอง วนไม่รู้จบ แท็บใหม่ไม่เกิดสักอัน
      ⇒ เปลี่ยนชื่อเป็น openApp() · มียามคุมไว้ที่ npm run test:newtab */

/* ═══════════════════════════════════════════════════════════════════
 *  📱 19 ก.ย. 69 — "กดเข้าแอปย่อยแล้วขึ้นหน้าขาว" บน iPhone
 *
 *  พี่เอส่งภาพมา 2 ใบ: หน้ารวมแอปขึ้นครบ (เห็นชื่อผู้ใช้ · นับแอปได้)
 *  แต่พอกดการ์ด ได้จอขาวเปล่า ไม่มีข้อความ ไม่มี error อะไรเลย
 *  หัวจอมีปุ่ม ˅ ✕ แถบล่างมี ‹ › ↻ ⬆ ⋮ = เบราว์เซอร์ในตัวของ LINE (WKWebView)
 *
 *  ── ที่พิสูจน์แล้วว่า "ไม่ใช่" เหตุ ────────────────────────────────
 *   ① ไม่ใช่ขนาดไฟล์ — เปิด /m/<app>/ ตรง ๆ ด้วย UA ของ iPhone+LINE
 *      ได้ครบทุกแอปตั้งแต่ 1.2 MB ลงมา · console error = 0
 *   ② ไม่ใช่ไวยากรณ์ใหม่ (?. / ??) — บรรทัด 174 ของไฟล์นี้เองใช้ ??
 *      ถ้าเครื่องเขาอ่านไม่ออก "หน้ารวมแอปก็ต้องขาวไปด้วย" แต่ภาพที่ส่งมาขึ้นครบ
 *   ③ ไม่ใช่ JS ของหน้าแอปตาย — ทุกหน้ามี HTML นิ่ง ๆ ใน <body> อยู่แล้ว
 *      (หัวข้อ · แถบเมนู · ปุ่ม "← หน้ารวมแอป") JS ตายก็ยังเห็นของพวกนี้
 *      ⇒ "ขาวสนิทไม่มีอะไรเลย" แปลว่า **หน้าแอปไม่เคยถูกโหลด**
 *   ④ ไม่ใช่สิทธิ์ไม่พอ — การ์ดที่กดไม่ได้ถูกทำเป็น disabled อยู่แล้ว กดไม่ลง
 *
 *  ── ⇒ เหลือที่เดียว: "วิธีเปิดแท็บ" ข้างล่างนี้ ────────────────────
 *   ของเดิมเปิดแท็บเปล่าไว้ก่อน (window.open('')) แล้วค่อยพาไป URL ทีหลัง
 *   ซึ่งเป็นท่าที่จำเป็นบนคอม (กันโดนบล็อกป๊อปอัป) แต่บนเบราว์เซอร์ในตัว
 *   ของแอปแชตบน iOS มัน "ไม่มีแท็บ" ⇒ ได้หน้าเปล่าที่หน้าเดิมสั่งต่อไม่ได้
 *   แล้วก็ค้างขาวอยู่อย่างนั้น ไม่มีใครบอกอะไรสักคำ
 *
 *  ⇒ แก้ 2 ชั้น (ชั้นหลังกันชั้นหน้าพลาด):
 *    ① อยู่ในเบราว์เซอร์ในตัวของแอปแชต = ไม่เปิดแท็บเลย ไปในหน้าเดิม
 *       ‼ บนคอม/Safari ปกติ พฤติกรรมไม่เปลี่ยนแม้แต่นิดเดียว
 *    ② ยามเฝ้าหน้าเปล่า — 1.5 วิแล้วยังไม่ขยับ ให้กู้คืนเอง
 *       และถ้าปิดหน้านั้นไม่ได้ ให้ "เขียนข้อความบอกลงไปบนจอขาวนั้น"
 *       ⇒ ต่อไปนี้ user จะไม่เจอจอขาวเงียบ ๆ อีก จะมีข้อความไทยเสมอ
 * ═══════════════════════════════════════════════════════════════════ */

/* เบราว์เซอร์ในตัวของแอปแชต — LINE · Facebook · Instagram · WeChat · TikTok
   ‼ ห่อ try ไว้: ยาม npm run test:newtab รันสคริปต์นี้ใน Node ซึ่งไม่มี navigator
     และถ้าวันหลังมีที่ไหนโหลดไฟล์นี้นอกเบราว์เซอร์ ก็ต้องไม่ระเบิด */
const IN_APP_BROWSER = (function () {
  try {
    return /\b(Line|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|TikTok|KAKAOTALK)\b/i
      .test((navigator && navigator.userAgent) || '');
  } catch (_) { return false; }
})();

/* ‼ ข้อความที่เขียนลงจอขาว — ES5 ล้วน (หน้านั้นอาจเป็นเครื่องเก่า)
   ‼ LINE รองรับ ?openExternalBrowser=1 เพื่อเด้งออกเบราว์เซอร์จริง */
function blankPageHtml(msg, url){
  /* ‼ ที่อยู่เต็มเฉพาะ "ในหน้าข้อความ" นี้ — ไม่ได้แตะที่อยู่ที่ใช้เปิดแอปจริง
   *   (หน้านี้ถูกเขียนลง about:blank ซึ่งบางรุ่นตีความ path สัมพัทธ์ไม่ออก) */
  let ext = '/';
  if (url) {
    let full = url;
    try { full = new URL(url, location.href).href; } catch (_) {}
    ext = full + (full.indexOf('?') >= 0 ? '&' : '?') + 'openExternalBrowser=1';
  }
  return '<!doctype html><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<title>เปิดแอปไม่ได้</title>'
    + '<div style="font-family:Prompt,system-ui,sans-serif;max-width:460px;'
    + 'margin:40px auto;padding:22px;line-height:1.8;color:#0f172a">'
    + '<div style="font-size:44px;text-align:center">📱</div>'
    + '<h2 style="font-size:19px;text-align:center;margin:8px 0">เปิดแอปในหน้าต่างนี้ไม่ได้</h2>'
    + '<p style="color:#475569;font-size:14px">' + esc(msg) + '</p>'
    + '<p style="color:#475569;font-size:14px">มักเกิดตอนเปิดจากลิงก์ใน LINE '
    + 'เพราะเบราว์เซอร์ในตัวของ LINE เปิดหน้าใหม่ไม่ได้ '
    + '<b>ให้เปิดด้วยเบราว์เซอร์ของเครื่องแทน</b></p>'
    + '<a href="' + esc(ext) + '" style="display:block;text-align:center;background:#2ee6c5;'
    + 'color:#04241f;text-decoration:none;font-weight:700;padding:13px;border-radius:12px;'
    + 'margin-top:16px">เปิดในเบราว์เซอร์ของเครื่อง</a>'
    + '<p style="color:#94a3b8;font-size:12.5px;margin-top:14px">ถ้าปุ่มไม่ทำงาน: '
    + 'กดปุ่ม <b>⋮</b> มุมขวาล่าง แล้วเลือก <b>"เปิดในเบราว์เซอร์อื่น"</b> หรือ '
    + '<b>"Open in Safari"</b></p>'
    + '<p style="text-align:center;margin-top:10px"><a href="/" style="color:#0f766e;'
    + 'font-size:13px">← กลับหน้ารวมแอป</a></p></div>';
}

/* บอกผู้ใช้ให้ได้เสมอ — ‼ ถ้ามีหน้าเปล่าคาอยู่ ต้องเขียนลงหน้านั้น
   ไม่ใช่ alert() บนหน้ารวมแอปซึ่งถูกหน้าเปล่าบังอยู่ (user ไม่มีวันเห็น) */
function tellUser(tab, msg, url){
  if (tab && !tab.closed) {
    try { tab.document.open(); tab.document.write(blankPageHtml(msg, url)); tab.document.close(); return; }
    catch (_) {}
    try { tab.close(); } catch (_) {}
  }
  alert(msg);
}

/* ยามเฝ้าหน้าเปล่า — พาไปแล้วแต่ไม่ขยับ = กู้คืนให้ ไม่ปล่อยขาวเงียบ */
function watchBlankTab(tab, url){
  setTimeout(function(){
    if (!tab || tab.closed) return;
    let stuck = false;
    try { stuck = (tab.location.href === 'about:blank' || tab.location.href === ''); }
    catch (_) { return; }        /* อ่านไม่ได้ = ไปคนละที่แล้ว ถือว่าสำเร็จ */
    if (!stuck) return;
    tellUser(tab, 'หน้าต่างใหม่เปิดขึ้นมาแล้วแต่ไปต่อไม่ได้', url);
  }, 1500);
}

async function openApp(key, sameTab){
  /* ‼ ต้องเรียกตรงนี้ ก่อน await — ไม่งั้นโดนบล็อกป๊อปอัป (ดูหมายเหตุด้านบน)
     ‼ เบราว์เซอร์ในตัวของแอปแชต = ไม่เปิดแท็บ ไปในหน้าเดิมเลย */
  const tab = (sameTab || IN_APP_BROWSER) ? null : window.open('', tabName(key));
  try {
    const r = await fetch('/api/open/' + encodeURIComponent(key)).then(x => x.json());
    if (!r.ok) { tellUser(tab, r.error || 'เปิดแอปไม่ได้', null); return; }
    const url = r.url + '?t=' + encodeURIComponent(r.ticket);   /* ‼ ตั๋วติดไปด้วย */
    if (tab) { tab.location.replace(url); try { tab.opener = null; } catch (_) {} watchBlankTab(tab, url); }
    else location.href = url;
  } catch (e) { tellUser(tab, 'เปิดแอปไม่ได้ — ' + e.message, null); }
}

/* ── เมนูผู้ใช้ ── */

$('chpw').onclick = async () => {
  const cur = prompt('รหัสผ่านเดิม'); if (cur === null) return;
  const nw  = prompt('รหัสผ่านใหม่ (อย่างน้อย ' + MIN_PW + ' ตัวอักษร)'); if (nw === null) return;
  const r = await fetch('/api/change-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ current: cur, next: nw })
  }).then(x => x.json());
  alert(r.ok ? 'เปลี่ยนรหัสผ่านเรียบร้อย' : (r.error || 'เปลี่ยนไม่สำเร็จ'));
};
