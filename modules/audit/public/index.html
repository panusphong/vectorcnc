<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกการใช้งาน · CRM มดงานการป้าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1422;--bg2:#0f1c2e;--panel:rgba(255,255,255,.045);--brd:rgba(255,255,255,.10);
  --txt:#eef4f5;--dim:#8ba0ad;--teal:#16b89b;--teal2:#2ee6c5;--red:#f0616d;--amber:#f5b544}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--txt);min-height:100vh;padding:24px 20px 60px}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.back{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--brd);
  padding:8px 14px;border-radius:999px;transition:.2s;white-space:nowrap}
.back:hover{color:var(--teal2);border-color:var(--teal)}
h1{font-size:20px;font-weight:700}
.sub{font-size:12.5px;color:var(--dim);margin-top:2px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--brd);border-radius:14px;padding:11px 16px;min-width:100px}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:11.5px;color:var(--dim)}
.stat.warn b{color:var(--amber)}.stat.bad b{color:var(--red)}
.cols{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
input,select{background:rgba(0,0,0,.28);border:1px solid var(--brd);color:var(--txt);
  border-radius:12px;padding:11px 14px;font:400 14px 'Prompt';outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(22,184,155,.16)}
select option{background:#0f1c2e}
#q{flex:1;min-width:180px}
.tbl{background:var(--panel);border:1px solid var(--brd);border-radius:18px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:12px 13px;font-size:11.5px;color:var(--dim);font-weight:600;
  background:rgba(0,0,0,.22);white-space:nowrap}
td{padding:11px 13px;border-top:1px solid var(--brd);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.02)}
.when{white-space:nowrap;color:var(--dim);font-size:12px}
.who{font-weight:600}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--brd);color:var(--dim);white-space:nowrap}
.tag.bad{color:var(--red);border-color:rgba(240,97,109,.4);background:rgba(240,97,109,.09)}
.tag.ok{color:var(--teal2);border-color:rgba(46,230,197,.4);background:rgba(46,230,197,.09)}
.det{color:var(--dim);font-size:11.5px;word-break:break-word;max-width:320px;line-height:1.5}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--brd);border-radius:18px;padding:16px 18px}
.card h3{font-size:13px;margin-bottom:12px;color:var(--dim);font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
  border-top:1px solid var(--brd);font-size:13px}
.row:first-of-type{border-top:none}
.row b{font-weight:600}
.row.bad b{color:var(--red)}
.none{color:var(--dim);font-size:12.5px;padding:6px 0}
.empty{padding:44px;text-align:center;color:var(--dim);font-size:14px}
.foot{padding:12px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--brd)}
@media(max-width:940px){
  .cols{grid-template-columns:1fr}
  th:nth-child(5),td:nth-child(5){display:none}
  body{padding:16px 12px 50px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="/">← หน้ารวมแอป</a>
    <div><h1>🔍 บันทึกการใช้งาน</h1><div class="sub">ใครเข้าใช้อะไร เมื่อไร · แก้ไขไม่ได้ ลบไม่ได้</div></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <input id="q" placeholder="🔍 ค้นหา ผู้ใช้ / โมดูล / รายละเอียด…">
    <select id="fa"><option value="">ทุกเหตุการณ์</option></select>
    <select id="fd">
      <option value="1">24 ชั่วโมง</option>
      <option value="7" selected>7 วัน</option>
      <option value="30">30 วัน</option>
      <option value="90">90 วัน</option>
    </select>
  </div>

  <div class="cols">
    <div class="tbl">
      <table>
        <thead><tr>
          <th>เวลา</th><th>ผู้ใช้</th><th>เหตุการณ์</th><th>โมดูล</th><th>รายละเอียด</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="empty">กำลังโหลด…</td></tr></tbody>
      </table>
      <div class="foot" id="foot"></div>
    </div>

    <div class="side">
      <div class="card"><h3>⚠️ ล็อกอินพลาดบ่อย</h3><div id="failTop"></div></div>
      <div class="card"><h3>เข้าใช้บ่อยที่สุด</h3><div id="topUsers"></div></div>
      <div class="card"><h3>โมดูลที่เปิดบ่อย</h3><div id="topModules"></div></div>
    </div>
  </div>
</div>

<script>
const B = '/m/audit';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmt = iso => {
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  const p = n => String(n).padStart(2, '0');
  const today = new Date();
  const same = d.toDateString() === today.toDateString();
  const time = p(d.getHours()) + ':' + p(d.getMinutes());
  return same ? 'วันนี้ ' + time : p(d.getDate()) + '/' + p(d.getMonth() + 1) + ' ' + time;
};

/** ย่อ detail ให้อ่านง่าย — ตัด JSON ที่ยาวเกินทิ้ง */
function shortDetail(s) {
  if (!s) return '';
  try {
    const o = JSON.parse(s);
    const parts = [];
    for (const [k, v] of Object.entries(o)) {
      if (v === '' || v == null) continue;
      parts.push(k + ': ' + (Array.isArray(v) ? v.join(', ') : String(v)));
    }
    return parts.join(' · ').slice(0, 160);
  } catch { return String(s).slice(0, 160); }
}

async function api(path) {
  const r = await fetch(B + path);
  let j = {};
  try { j = await r.json(); } catch { /* ไม่ใช่ JSON */ }
  if (!r.ok || !j.ok) throw new Error(j.error || ('ผิดพลาด HTTP ' + r.status));
  return j;
}

const listRows = (arr, keyName, bad) => arr.length
  ? arr.map(x => `<div class="row ${bad ? 'bad' : ''}">
      <span>${esc(x[keyName]) || '—'}</span><b>${x.count}</b></div>`).join('')
  : '<div class="none">ไม่มีข้อมูลในช่วงนี้</div>';

async function loadStats() {
  try {
    const j = await api('/api/stats?days=' + $('fd').value);
    $('stats').innerHTML = [
      ['เหตุการณ์ทั้งหมด', j.total, ''],
      ['เข้าสู่ระบบสำเร็จ', j.logins, ''],
      ['ล็อกอินพลาด', j.fails, j.fails ? 'warn' : ''],
      ['ถูกปฏิเสธ (บัญชีปิด)', j.blocked, j.blocked ? 'bad' : ''],
    ].map(([l, v, c]) => `<div class="stat ${c}"><b>${v}</b><span>${l}</span></div>`).join('');

    $('failTop').innerHTML    = listRows(j.failTop, 'username', true);
    $('topUsers').innerHTML   = listRows(j.topUsers, 'username');
    $('topModules').innerHTML = listRows(j.topModules, 'module');

    const cur = $('fa').value;
    $('fa').innerHTML = '<option value="">ทุกเหตุการณ์</option>' +
      j.actions.map(a => `<option value="${esc(a.action)}"${a.action === cur ? ' selected' : ''}>${esc(a.label)} (${a.count})</option>`).join('');
  } catch (e) {
    $('stats').innerHTML = '<div class="stat bad"><b>!</b><span>' + esc(e.message) + '</span></div>';
  }
}

async function loadList() {
  try {
    const j = await api('/api/list?days=' + $('fd').value +
      '&action=' + encodeURIComponent($('fa').value) +
      '&q=' + encodeURIComponent($('q').value.trim()));

    $('rows').innerHTML = j.events.length ? j.events.map(e => `<tr>
      <td class="when">${fmt(e.at)}</td>
      <td><div class="who">${esc(e.username) || '—'}</div>
          <div class="det">${esc(e.role)}</div></td>
      <td><span class="tag ${e.alert ? 'bad' : (e.action === 'login_ok' ? 'ok' : '')}">${esc(e.label)}</span></td>
      <td>${esc(e.module) || '<span class="det">—</span>'}</td>
      <td class="det">${esc(shortDetail(e.detail))}${e.target ? ' → ' + esc(e.target) : ''}</td>
    </tr>`).join('')
      : '<tr><td colspan="5" class="empty">ไม่พบเหตุการณ์ในช่วงเวลานี้</td></tr>';

    $('foot').textContent = j.events.length
      ? 'แสดง ' + j.events.length + ' รายการ' + (j.truncated ? ' (ถึงขีดจำกัด — ลองแคบช่วงเวลาลง)' : '')
      : '';
  } catch (e) {
    $('rows').innerHTML = '<tr><td colspan="5" class="empty">' + esc(e.message) + '</td></tr>';
  }
}

const reload = () => { loadStats(); loadList(); };

let t;
$('q').oninput  = () => { clearTimeout(t); t = setTimeout(loadList, 280); };
$('fa').onchange = loadList;
$('fd').onchange = reload;

reload();
setInterval(loadList, 60000);   // รีเฟรชเงียบ ๆ ทุก 1 นาที
</script>
</body>
</html>
